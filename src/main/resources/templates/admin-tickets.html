<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RE-TECH SUPPORT - Panel Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">RE-TECH SUPPORT</span>
        <span class="text-white"><span th:text="${usuario.nombre}"></span> (Admin) | <a th:href="@{/logout}" class="text-danger">Cerrar sesión</a></span>
    </nav>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Tickets Registrados</h3>
            <a th:href="@{/tickets/nuevo}" class="btn btn-primary">+ Nuevo Ticket</a>
        </div>
        <table class="table table-striped table-bordered bg-white">
            <thead class="table-dark">
                <tr>
                    <th>N° Ticket</th>
                    <th>Fecha</th>
                    <th>Categoría</th>
                    <th>Sede</th>
                    <th>Prioridad</th>
                    <th>Estado</th>
                    <th>Técnico</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${tickets}">
                    <td th:text="${t.numeroTicket}"></td>
                    <td th:text="${#temporals.format(t.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${t.categoria.nombre}"></td>
                    <td th:text="${t.sede}"></td>
                    <td th:text="${t.prioridad}"></td>
                    <td th:text="${t.estado.nombre}"></td>
                    <td th:text="${t.tecnico != null ? t.tecnico.nombre : 'Sin asignar'}"></td>
                    <td>
                        <a th:href="@{/tickets/detalle/{id}(id=${t.id})}" class="btn btn-info btn-sm text-white">Ver</a>
                        <a th:href="@{/tickets/atender/{id}(id=${t.id})}" class="btn btn-warning btn-sm">Atender</a>
                        <a th:href="@{/tickets/eliminar/{id}(id=${t.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro de eliminar el ticket?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
