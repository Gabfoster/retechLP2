<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h3>Nuevo Ticket de Soporte</h3>
            <hr>
            <form th:action="@{/tickets/guardar}" th:object="${ticket}" method="post">
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select th:field="*{categoria.id}" class="form-select">
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Sede</label>
                    <input type="text" th:field="*{sede}" class="form-control" required placeholder="Ej. Sede Lima Norte">
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción del problema</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Prioridad</label>
                    <select th:field="*{prioridad}" class="form-select">
                        <option value="Alta">Alta</option>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Asignar Técnico</label>
                    <select th:field="*{tecnico.id}" class="form-select">
                        <option th:each="tec : ${tecnicos}" th:value="${tec.id}" th:text="${tec.nombre}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Crear Ticket</button>
                <a th:href="@{/tickets/admin}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
