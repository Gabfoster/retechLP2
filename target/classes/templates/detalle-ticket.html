<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4" style="max-width: 800px;">
        <div class="card shadow p-4">
            <h3 th:text="'Ticket ' + ${ticket.numeroTicket}"></h3>
            <hr>
            <p><strong>Categoría:</strong> <span th:text="${ticket.categoria.nombre}"></span></p>
            <p><strong>Sede:</strong> <span th:text="${ticket.sede}"></span></p>
            <p><strong>Prioridad:</strong> <span th:text="${ticket.prioridad}"></span></p>
            <p><strong>Estado Actual:</strong> <span th:text="${ticket.estado.nombre}"></span></p>
            <p><strong>Técnico Asignado:</strong> <span th:text="${ticket.tecnico != null ? ticket.tecnico.nombre : 'Ninguno'}"></span></p>
            <p><strong>Descripción:</strong> <span th:text="${ticket.descripcion}"></span></p>
            
            <h5 class="mt-4">Historial de Cambios</h5>
            <table class="table table-bordered mt-2">
                <thead class="table-dark">
                    <tr>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Observación</th>
                        <th>Usuario</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="h : ${historial}">
                        <td th:text="${#temporals.format(h.fechaCambio, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${h.estado.nombre}"></td>
                        <td th:text="${h.observacion}"></td>
                        <td th:text="${h.usuario}"></td>
                    </tr>
                </tbody>
            </table>
            <a th:href="@{/tickets/admin}" class="btn btn-secondary mt-3">Volver</a>
        </div>
    </div>
</body>
</html>
