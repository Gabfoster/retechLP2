<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Atender Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4" style="max-width: 700px;">
        <div class="card shadow p-4">
            <h3 th:text="'Atender Ticket — ' + ${ticket.numeroTicket}"></h3>
            <hr>
            <form th:action="@{/tickets/atender}" method="post">
                <input type="hidden" name="id" th:value="${ticket.id}" />
                
                <div class="mb-3">
                    <label class="form-label">Nuevo Estado</label>
                    <select name="idEstado" class="form-select">
                        <option th:each="e : ${estados}" th:value="${e.id}" th:text="${e.nombre}" th:selected="${e.id == ticket.estado.id}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Técnico Asignado</label>
                    <select name="idTecnico" class="form-select">
                        <option th:each="tec : ${tecnicos}" th:value="${tec.id}" th:text="${tec.nombre}" th:selected="${ticket.tecnico != null and tec.id == ticket.tecnico.id}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Observación del soporte técnico</label>
                    <textarea name="observacion" class="form-control" rows="3" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Guardar Atención</button>
                <a th:href="@{/tickets/admin}" class="btn btn-secondary">Volver</a>
            </form>
        </div>
    </div>
</body>
</html>
