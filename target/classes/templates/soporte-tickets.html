<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RE-TECH SUPPORT - Panel Técnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">RE-TECH SUPPORT</span>
        <span class="text-white"><span th:text="${usuario.nombre}"></span> (Soporte) | <a th:href="@{/logout}" class="text-danger">Cerrar sesión</a></span>
    </nav>
    <div class="container mt-4">
        <h3>Tickets Asignados / Sistema</h3>
        <table class="table table-striped table-bordered bg-white mt-3">
            <thead class="table-dark">
                <tr>
                    <th>N° Ticket</th>
                    <th>Categoría</th>
                    <th>Sede</th>
                    <th>Prioridad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${tickets}">
                    <td th:text="${t.numeroTicket}"></td>
                    <td th:text="${t.categoria.nombre}"></td>
                    <td th:text="${t.sede}"></td>
                    <td th:text="${t.prioridad}"></td>
                    <td th:text="${t.estado.nombre}"></td>
                    <td>
                        <a th:href="@{/tickets/detalle/{id}(id=${t.id})}" class="btn btn-info btn-sm text-white">Ver Historial</a>
                        <a th:href="@{/tickets/atender/{id}(id=${t.id})}" class="btn btn-primary btn-sm">Atender / Cambiar Estado</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
